[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
# errors & logging
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
# math & data
nalgebra = "0.32"
ndarray = { version = "0.15", features = ["rayon", "serde"] }
num = "0.4"
ordered-float = "4.0"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
rayon = "1.8"
crossbeam = "0.8"
# graphs & collections
petgraph = "0.6"
indexmap = { version = "2.0", features = ["serde"] }
lru = "0.12"
generational-arena = "0.2"
typed-arena = "2.0"
bumpalo = { version = "3.14", features = ["collections"] }
# hashing & time & misc
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
nom = "7.1"
regex = "1.10"

# shared dev-dependencies (referenced with workspace = true in [dev-dependencies])
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true
